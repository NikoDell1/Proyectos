<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="tarjeta">

        <div class="pantalla" id="numero" aria-live="polite">
            0
        </div>
        <div class="botones">

            <button id="sumar">+</button>
            <button class="secundario" id="restar">-</button>

        </div>
        <button class="reiniciar" id="reiniciar">Restart</button>
    </main>
</body>
</html>
